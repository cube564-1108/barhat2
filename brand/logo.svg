<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="petalGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#D19CC2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E4C2DD;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Центральный круг (ядро) -->
  <circle cx="50" cy="50" r="4" fill="url(#petalGradient)" opacity="0.8"/>

  <!-- Левый лепесток -->
  <path d="M50 50 Q 35 35, 25 40 Q 15 45, 20 55 Q 25 58, 35 55 Q 45 52, 50 50"
        fill="url(#petalGradient)" opacity="0.7"/>

  <!-- Правый лепесток (зеркальный) -->
  <path d="M50 50 Q 65 35, 75 40 Q 85 45, 80 55 Q 75 58, 65 55 Q 55 52, 50 50"
        fill="url(#petalGradient)" opacity="0.7"/>

  <!-- Верхний лепесток -->
  <path d="M50 50 Q 50 30, 50 22 Q 50 18, 54 22 Q 58 28, 55 40 Q 52 48, 50 50"
        fill="url(#petalGradient)" opacity="0.6"/>

  <!-- Левый нижний лепесток -->
  <path d="M50 50 Q 40 60, 32 68 Q 28 72, 32 76 Q 38 78, 46 68 Q 50 60, 50 50"
        fill="url(#petalGradient)" opacity="0.65"/>

  <!-- Правый нижний лепесток (зеркальный) -->
  <path d="M50 50 Q 60 60, 68 68 Q 72 72, 68 76 Q 62 78, 54 68 Q 50 60, 50 50"
        fill="url(#petalGradient)" opacity="0.65"/>
</svg>
